name: Publish to npm

# Releases ship only from GitHub Actions: bump the version and push a `v*` tag.
# `prepublishOnly` blocks local `npm publish`, so this workflow is the only path.
# There is NO manual entry: `workflow_dispatch` was removed so every publish
# must come from a version tag, and the tag must match package.json.
#
# Trusted Publishing:
#   https://www.npmjs.com/package/opencode-schedule-center/access
#   Repository: meiyx7/opencode-schedule-center
#   Workflow:   publish.yml
#
# OIDC cannot create a package's first version. The first 0.1.0 publish must
# be done once with a logged-in npm CLI (or a one-time publish token); after
# that, tag pushes use the trusted publisher and no token is stored here.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use npm with Trusted Publishing support
        run: npm install -g npm@latest

      - name: Remove deprecated always-auth setting
        run: npm config delete always-auth || true

      - name: Install
        run: npm ci

      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match package.json $version" >&2
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check whether target version is already published
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "ALREADY_PUBLISHED=$name@$version" >> "$GITHUB_ENV"
          else
            echo "ALREADY_PUBLISHED=" >> "$GITHUB_ENV"
          fi

      - name: Publish
        # A re-pushed tag for an already-published version is a no-op, not a
        # failure; anything unpublishable above already aborted the job.
        if: env.ALREADY_PUBLISHED == ''
        run: npm publish --access public --provenance
